name: WarePro signed draft release

on:
  push:
    tags:
      - 'v*.*.*' # Build script validates v[0-9]+.[0-9]+.[0-9]+ exactly.

permissions:
  contents: read

jobs:
  build-draft:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      WAREPRO_TEMP_PFX: ${{ runner.temp }}\warepro-signing.pfx
      WAREPRO_SIGNING_CERT_PFX_BASE64: ${{ secrets.WAREPRO_SIGNING_CERT_PFX_BASE64 }}
      WAREPRO_SIGNING_CERT_PASSWORD: ${{ secrets.WAREPRO_SIGNING_CERT_PASSWORD }}
      WAREPRO_EXPECTED_PUBLISHER_THUMBPRINT: ${{ vars.WAREPRO_PUBLISHER_THUMBPRINT }}

    steps:
      - name: Checkout reviewed tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install pinned Inno Setup 6.7.3
        shell: powershell
        run: choco install innosetup --version=6.7.3 --yes --no-progress

      - name: Build and verify signed artifacts
        shell: powershell
        run: |
          $version = '${{ github.ref_name }}'.Substring(1)
          .\scripts\release\Build-WareProRelease.ps1 -Version $version -DraftOnly

      - name: Verify release as an independent client
        shell: powershell
        run: |
          $version = '${{ github.ref_name }}'.Substring(1)
          .\scripts\release\Verify-WareProRelease.ps1 `
            -ArtifactDirectory ".\artifacts\release\$version" `
            -ExpectedVersion $version `
            -ExpectedPublisherThumbprint $env:WAREPRO_EXPECTED_PUBLISHER_THUMBPRINT `
            -RequireSignature

      - name: Create draft in artifact repository
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.WAREPRO_RELEASE_TOKEN }}
          GH_REPO: TheGiver262/WarePro-Releases
        run: |
          $version = '${{ github.ref_name }}'.Substring(1)
          $directory = ".\artifacts\release\$version"
          gh release create "v$version" `
            "$directory\WarePro-Setup.exe" `
            "$directory\warepro-update.json" `
            "$directory\WarePro-Setup.exe.sha256" `
            --repo $env:GH_REPO `
            --title "WarePro $version" `
            --notes-file "$directory\release-notes.md" `
            --draft

      - name: Record external smoke gate
        shell: powershell
        run: |
          'Draft only. A separate approved smoke matrix must pass before a human publishes this release.' |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Always remove temporary signing certificate
        if: always()
        shell: powershell
        run: |
          if (Test-Path -LiteralPath $env:WAREPRO_TEMP_PFX) {
            Remove-Item -LiteralPath $env:WAREPRO_TEMP_PFX -Force
          }
